<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
      

    <section class="info-page">
      <div class="title">Estimate Your Result</div>
      
        <div class="input-group">
            <label for="name" >Student Name:</label>
            <input type="text"autocomplete="off" id="name" placeholder="Enter your Name">
        </div>
        <div class="input-group">
            <label for="rollno">Roll Number:</label>
            <input type="number" id="rollno" placeholder="Enter your Roll Number">
        </div>
         <div class="selections"> 
            <div class="classes">
                <select name="classes" id="Class">
                    <option value="" disabled selected>Select Class</option>
                    <option value="9th">9th</option>
                    <option value="10th">10th</option>
                    <option value="11th">11th</option>
                    <option value="12th">12th</option>
                    <option value="Matric">Matric</option>
                    <option value="Intermediate">Intermediate</option>
                </select>
            </div>
             
          </div>
            
            <div class="btn">
                <button id="calculateBtn">Calculate</button>
                <button id="downloadBtn">Download Result</button>
            </div>

          </section>


          
       
    </div>
        </div> 

        


    




    <script src="script.js"></script>
</body>
</html>
